<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 112" fill="none" role="img" aria-label="北港3D 产品展示">
  <defs>
    <!-- 文字渐变 -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3df0ff" />
      <stop offset="45%" stop-color="#2f7bff" />
      <stop offset="100%" stop-color="#b15cff" />
    </linearGradient>
    <!-- 立方体三面渐变 -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ff6ff" />
      <stop offset="100%" stop-color="#2f7bff" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f74ff" />
      <stop offset="100%" stop-color="#1b2f8a" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2746c4" />
      <stop offset="100%" stop-color="#0c1a57" />
    </linearGradient>
    <!-- 地面光环 -->
    <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f7bff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#2f7bff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3.6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 地面光环 + 透视网格 -->
  <g>
    <ellipse cx="72" cy="98" rx="54" ry="14" fill="url(#floorGlow)" />
    <ellipse cx="72" cy="98" rx="54" ry="14" fill="none" stroke="#3df0ff" stroke-width="0.8" stroke-opacity="0.5" filter="url(#glow)" />
    <path d="M18 98 L126 98" stroke="#2f7bff" stroke-width="0.5" stroke-opacity="0.4" />
    <path d="M40 91 L104 91" stroke="#2f7bff" stroke-width="0.4" stroke-opacity="0.3" />
    <path d="M40 105 L104 105" stroke="#2f7bff" stroke-width="0.4" stroke-opacity="0.3" />
  </g>

  <!-- 等距 3D 立方体 -->
  <g filter="url(#glow)">
    <!-- 左面 -->
    <path d="M34 40 L72 58 L72 94 L34 76 Z" fill="url(#cubeLeft)" stroke="#7aa0ff" stroke-width="1" />
    <!-- 右面 -->
    <path d="M110 40 L72 58 L72 94 L110 76 Z" fill="url(#cubeRight)" stroke="#7aa0ff" stroke-width="1" />
    <!-- 顶面 -->
    <path d="M72 22 L110 40 L72 58 L34 40 Z" fill="url(#cubeTop)" stroke="#9ff8ff" stroke-width="1.3" />
    <!-- 顶面左半高光 -->
    <path d="M72 22 L34 40 L72 58 Z" fill="#ffffff" fill-opacity="0.14" />
    <!-- 前竖棱高亮 -->
    <path d="M72 22 L72 58 L72 94" stroke="#cafaff" stroke-width="0.8" stroke-opacity="0.75" />
  </g>

  <!-- 立方体正面立体 3D 字样 -->
  <text x="91" y="74" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#eafcff" filter="url(#strongGlow)" letter-spacing="1">3D</text>

  <!-- 浮动粒子 -->
  <circle cx="120" cy="26" r="2" fill="#3df0ff" filter="url(#glow)" />
  <circle cx="20" cy="34" r="1.4" fill="#b15cff" filter="url(#glow)" />
  <circle cx="118" cy="60" r="1.1" fill="#2f7bff" />
  <circle cx="30" cy="64" r="0.9" fill="#6ff6ff" />

  <!-- 右侧文字 -->
  <g filter="url(#glow)">
    <text x="134" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="44" font-weight="900" fill="url(#brandGrad)" letter-spacing="2">北港3D</text>
    <text x="138" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#eaf2ff" letter-spacing="6" opacity="0.94">产品展示</text>
    <text x="138" y="99" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="7.5" font-weight="500" fill="#3df0ff" letter-spacing="1.8" opacity="0.8">PRODUCT SHOWCASE · DIGITAL TWIN</text>
  </g>

  <!-- 右侧竖向科技条 -->
  <g transform="translate(372, 18)" opacity="0.7">
    <rect x="0" y="0" width="2.4" height="56" rx="1.2" fill="url(#brandGrad)" filter="url(#glow)" />
    <rect x="7" y="12" width="2" height="34" rx="1" fill="#3df0ff" opacity="0.5" />
    <rect x="13" y="22" width="2" height="16" rx="1" fill="#b15cff" opacity="0.5" />
  </g>
</svg>
